# AI draft: board review pending
#
# Letter -> candidate Arabic letters for the Arabizi converter (step 2 of the board's design).
# Letters only, no words. Each key is a Latin letter, digraph or digit; the value lists candidate
# Arabic letters, most likely first. An empty string means "write nothing" (a skipped vowel).
# The board edits this file; the converter ranks the candidates with a word list.

[digraphs]
sh = ["ش"]
kh = ["خ"]
gh = ["غ"]
th = ["ث", "ت"]
dh = ["ذ", "ض"]
ch = ["تش", "ش"]
aa = ["ا"]
ee = ["ي"]
oo = ["و"]

[digits]
"2" = ["ء", "أ", "ق"]
"3" = ["ع"]
"5" = ["خ"]
"6" = ["ط"]
"7" = ["ح"]
"8" = ["غ", "ق"]
"9" = ["ق", "ص"]

[letters]
a = ["ا", "ة", "ى", ""]
b = ["ب"]
c = ["ك", "س"]
d = ["د", "ض"]
e = ["ي", ""]
f = ["ف"]
g = ["غ", "ج", "ق"]
h = ["ه", "ح"]
i = ["ي", ""]
j = ["ج"]
k = ["ك", "ق"]
l = ["ل"]
m = ["م"]
n = ["ن"]
o = ["و", ""]
p = ["ب"]
q = ["ق", "ك"]
r = ["ر"]
s = ["س", "ص"]
t = ["ت", "ط"]
u = ["و", ""]
v = ["ف"]
w = ["و"]
x = ["كس"]
y = ["ي"]
z = ["ز", "ظ"]
