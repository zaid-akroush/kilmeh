<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الفوترة</title>
  <link rel="stylesheet" href="/dist/app.css">
</head>
<body class="bg-slate-50 text-slate-900">
  <aside data-testid="sidebar" class="border-b border-slate-200 bg-white p-4 md:fixed md:left-0 md:top-0 md:h-full md:w-64 md:border-b-0 md:border-r">
    <h2 data-testid="brand" class="mb-4 text-lg font-bold">لوحة التحكم</h2>
    <nav data-testid="side-nav">
      <ul class="space-y-1">
        <li><a data-testid="nav-link" href="index.html" class="block rounded-r-md border-l-4 border-l-transparent py-2 pl-3 hover:border-l-slate-300">الملف الشخصي</a></li>
        <li><a data-testid="nav-link" href="notifications.html" class="block rounded-r-md border-l-4 border-l-transparent py-2 pl-3 hover:border-l-slate-300">الإشعارات</a></li>
        <li><a data-testid="nav-link" href="billing.html" class="block rounded-r-md border-l-4 border-l-blue-500 bg-blue-50 py-2 pl-3 font-semibold">الفوترة</a></li>
      </ul>
    </nav>
  </aside>

  <main data-testid="main" class="p-4 md:ml-64 md:pl-8">
    <h1 data-testid="page-title" class="mb-6 text-2xl font-bold">الفوترة</h1>
    <section data-testid="plan" class="relative rounded-tl-lg rounded-br-md bg-white p-4 pl-6 shadow-sm">
      <span data-testid="plan-badge" class="absolute left-0 top-4 h-6 w-1 rounded-r bg-blue-600"></span>
      <h3 class="text-sm text-slate-500">الخطة الحالية</h3>
      <p class="text-2xl font-bold">25.00</p>
    </section>
    <section class="mt-6 rounded-lg bg-white p-4 shadow-sm">
      <h3 class="text-sm text-slate-500">رقم الحساب</h3>
      <p data-testid="iban" dir="ltr" class="mt-1 rounded-md bg-slate-50 px-3 py-2 text-left font-mono text-sm">JO94 CBJO 0010 0000 0000 0131 0003 02</p>
      <h3 class="mt-4 text-sm text-slate-500">البطاقة</h3>
      <p data-testid="card-number" dir="ltr" class="mt-1 rounded-md bg-slate-50 px-3 py-2 text-left font-mono text-sm">•••• •••• •••• 4242</p>
    </section>
    <table data-testid="invoices" class="mt-6 w-full bg-white text-sm shadow-sm">
      <thead>
        <tr><th class="py-2 pl-4 text-left">التاريخ</th><th class="py-2 pr-4 text-right">المبلغ</th></tr>
      </thead>
      <tbody>
        <tr><td class="py-2 pl-4 text-left">2026-10-01</td><td data-testid="amount" class="py-2 pr-4 text-right">25.00</td></tr>
        <tr><td class="py-2 pl-4 text-left">2026-09-01</td><td data-testid="amount" class="py-2 pr-4 text-right">25.00</td></tr>
      </tbody>
    </table>
    <div class="mt-6 flex">
      <button data-testid="download" class="ml-auto inline-flex items-center rounded-md border border-slate-300 bg-white px-4 py-2"><span class="btn-icon h-3 w-3 rounded-sm bg-blue-600"></span>تنزيل</button>
    </div>
  </main>
</body>
</html>
