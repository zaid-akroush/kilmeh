<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الإشعارات</title>
  <link rel="stylesheet" href="/dist/app.css">
</head>
<body class="bg-slate-50 text-slate-900">
  <aside data-testid="sidebar" class="border-b border-slate-200 bg-white p-4 md:fixed md:left-0 md:top-0 md:h-full md:w-64 md:border-b-0 md:border-r">
    <h2 data-testid="brand" class="mb-4 text-lg font-bold">لوحة التحكم</h2>
    <nav data-testid="side-nav">
      <ul class="space-y-1">
        <li><a data-testid="nav-link" href="index.html" class="block rounded-r-md border-l-4 border-l-transparent py-2 pl-3 hover:border-l-slate-300">الملف الشخصي</a></li>
        <li><a data-testid="nav-link" href="notifications.html" class="block rounded-r-md border-l-4 border-l-blue-500 bg-blue-50 py-2 pl-3 font-semibold">الإشعارات</a></li>
        <li><a data-testid="nav-link" href="billing.html" class="block rounded-r-md border-l-4 border-l-transparent py-2 pl-3 hover:border-l-slate-300">الفوترة</a></li>
      </ul>
    </nav>
  </aside>

  <main data-testid="main" class="p-4 md:ml-64 md:pl-8">
    <h1 data-testid="page-title" class="mb-6 text-2xl font-bold">الإشعارات</h1>
    <div data-testid="filters" class="flex snap-x gap-2 overflow-x-auto scroll-pl-4 pb-2 pl-4">
      <a data-testid="filter" href="#" class="shrink-0 snap-start rounded-full border border-blue-600 bg-blue-600 px-3 py-1 text-sm text-white">الكل</a>
      <a data-testid="filter" href="#" class="shrink-0 snap-start rounded-full border border-slate-300 bg-white px-3 py-1 text-sm hover:border-r-2">غير مقروءة</a>
      <a data-testid="filter" href="#" class="shrink-0 snap-start rounded-full border border-slate-300 bg-white px-3 py-1 text-sm hover:border-r-2">الطلبات</a>
    </div>
    <ul class="mt-4 space-y-3">
      <li data-testid="notice" class="relative rounded-lg border-l-4 border-l-blue-500 bg-white p-4 pr-8 shadow-sm">
        <span data-testid="unread-dot" class="absolute right-3 top-3 h-2 w-2 rounded-full bg-blue-600"></span>
        <span data-testid="notice-time" class="float-right ml-2 text-xs text-slate-500">10:30</span>
        <p class="text-left">الطلبات الجديدة</p>
      </li>
      <li data-testid="notice" class="relative rounded-lg border-l-4 border-l-slate-300 bg-white p-4 pr-8 shadow-sm">
        <span data-testid="notice-time" class="float-right ml-2 text-xs text-slate-500">09:15</span>
        <p class="text-left">آخر تحديث اليوم</p>
      </li>
    </ul>
    <section class="mt-6 rounded-lg bg-white p-4 shadow-sm">
      <h3 data-testid="webhook-label" class="mb-2 text-sm text-slate-500">رابط الإشعارات</h3>
      <code data-testid="webhook" dir="ltr" class="block break-all rounded-md bg-slate-900 px-3 py-2 text-left text-sm text-slate-100">https://hooks.example.com/notify/a1b2c3</code>
    </section>
  </main>
</body>
</html>
