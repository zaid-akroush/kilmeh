<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الملف الشخصي</title>
  <link rel="stylesheet" href="/dist/app.css">
</head>
<body class="bg-slate-50 text-slate-900">
  <aside data-testid="sidebar" class="border-b border-slate-200 bg-white p-4 md:fixed md:left-0 md:top-0 md:h-full md:w-64 md:border-b-0 md:border-r">
    <h2 data-testid="brand" class="mb-4 text-lg font-bold">لوحة التحكم</h2>
    <nav data-testid="side-nav">
      <ul class="space-y-1">
        <li><a data-testid="nav-link" href="index.html" class="block rounded-r-md border-l-4 border-l-blue-500 bg-blue-50 py-2 pl-3 font-semibold">الملف الشخصي</a></li>
        <li><a data-testid="nav-link" href="notifications.html" class="block rounded-r-md border-l-4 border-l-transparent py-2 pl-3 hover:border-l-slate-300">الإشعارات</a></li>
        <li><a data-testid="nav-link" href="billing.html" class="block rounded-r-md border-l-4 border-l-transparent py-2 pl-3 hover:border-l-slate-300">الفوترة</a></li>
      </ul>
    </nav>
  </aside>

  <main data-testid="main" class="p-4 md:ml-64 md:pl-8">
    <h1 data-testid="page-title" class="mb-6 text-2xl font-bold">الملف الشخصي</h1>
    <section data-testid="profile-card" class="flow-root rounded-lg bg-white p-4 shadow-sm">
      <div data-testid="avatar" class="float-left mr-4 h-16 w-16 rounded-full bg-blue-600"></div>
      <div class="overflow-hidden">
        <h3 data-testid="email-label" class="text-sm text-slate-500">البريد الإلكتروني<span data-testid="verified" class="ml-[3px] inline-block h-2 w-2 rounded-full bg-green-500"></span></h3>
        <p data-testid="email" dir="ltr" class="mt-1 rounded-md border border-slate-200 bg-slate-50 px-3 py-2 text-left font-mono text-sm">user@example.com</p>
      </div>
    </section>
    <section class="mt-6 rounded-lg bg-white p-4 shadow-sm">
      <h3 class="mb-2 text-sm text-slate-500">اللغة</h3>
      <div data-testid="lang-switch" class="inline-flex">
        <button data-testid="lang-option" class="rounded-l-md border border-slate-300 bg-blue-600 px-4 py-2 text-white">العربية</button>
        <button data-testid="lang-option" class="-ml-px rounded-r-md border border-slate-300 bg-white px-4 py-2">English</button>
      </div>
    </section>
    <p data-testid="tip" class="mt-6 rounded-tl-lg rounded-br-md border-l-4 border-l-amber-400 bg-amber-50 p-4 pl-5 text-left text-sm">أكمل ملفك الشخصي</p>
    <div class="mt-6 flex">
      <button data-testid="save" class="ml-auto rounded-md bg-blue-600 px-6 py-2 text-white"><span class="btn-icon inline-block h-3 w-3 rounded-sm bg-white"></span>حفظ</button>
    </div>
  </main>
</body>
</html>
