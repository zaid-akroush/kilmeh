track = "c-rtl-ui"
title = "Give each mixed Arabic and English message its own base direction"
difficulty = "easy"
split = "public"
pair_id = "rtl-bidi-chat-feed"
stack = ["html", "css"]

# en is a short AI draft; the full requirements are in fixture/SPEC.md. levantine is a placeholder: the board writes it (see REVIEW.md).
[prompts.en]
file = "prompts/en.md"
lang = "en"
kind = "en"
review_status = "draft"

[prompts.levantine]
file = "prompts/levantine.md"
lang = "ar"
kind = "dialect"
