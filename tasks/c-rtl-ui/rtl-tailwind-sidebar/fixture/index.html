<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لوحة التحكم</title>
  <link rel="stylesheet" href="/dist/app.css">
</head>
<body class="bg-slate-50 text-slate-900">
  <aside data-testid="sidebar" class="fixed left-0 top-0 h-full w-64 border-r border-slate-200 bg-white p-4">
    <h2 data-testid="brand" class="mb-6 text-lg font-bold">لوحة التحكم</h2>
    <nav data-testid="side-nav">
      <ul class="space-y-2">
        <li><a data-testid="nav-link" href="#" class="block rounded px-3 py-2 hover:bg-slate-100">الرئيسية</a></li>
        <li><a data-testid="nav-link" href="#" class="block rounded px-3 py-2 hover:bg-slate-100">الطلبات</a></li>
        <li><a data-testid="nav-link" href="#" class="block rounded px-3 py-2 hover:bg-slate-100">المنتجات</a></li>
        <li><a data-testid="nav-link" href="#" class="block rounded px-3 py-2 hover:bg-slate-100">الإعدادات</a></li>
      </ul>
    </nav>
  </aside>

  <main data-testid="main" class="ml-64 break-words pl-6 py-6">
    <h1 data-testid="page-title" class="mb-4 text-2xl font-bold">نظرة عامة</h1>
    <section class="flex flex-col gap-4">
      <article data-testid="card" class="relative rounded-l-lg border-l-4 border-blue-500 bg-white p-4 text-left shadow-sm">
        <span data-testid="badge" class="absolute right-2 top-2 rounded bg-blue-600 px-2 py-0.5 text-xs text-white">جديد</span>
        <h3 class="text-sm text-slate-500">المبيعات</h3>
        <p class="text-2xl font-bold">1,250</p>
      </article>
      <article data-testid="card" class="relative rounded-l-lg border-l-4 border-blue-500 bg-white p-4 text-left shadow-sm">
        <h3 class="text-sm text-slate-500">الطلبات الجديدة</h3>
        <p class="text-2xl font-bold">48</p>
      </article>
      <article data-testid="card" class="relative rounded-l-lg border-l-4 border-blue-500 bg-white p-4 text-left shadow-sm">
        <h3 class="text-sm text-slate-500">العملاء</h3>
        <p class="text-2xl font-bold">312</p>
      </article>
    </section>
    <p data-testid="footer-note" class="mt-6 text-sm text-slate-500">آخر تحديث اليوم</p>
  </main>
</body>
</html>
