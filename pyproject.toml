[project]
name = "kilmeh"
version = "1.0.0"
description = "Open benchmark for coding agents on Arabic prompts, Arabic text in code, and RTL UI."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2.14.3",
]

[project.scripts]
kilmeh = "kilmeh.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]
browser = ["playwright==1.64.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kilmeh"]

[tool.ruff]
line-length = 100
extend-exclude = ["tests/fixtures", "tasks"]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# page markup and one-line CSS carried as data inside scripts
"tests/rtl_alternatives/**" = ["E501"]
"tests/rtl_gaming/**" = ["E501"]
"tests/rtl_mutations/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: needs a running Docker daemon",
    "browser: needs Playwright and Chromium",
]
addopts = "-m 'not docker and not browser'"
