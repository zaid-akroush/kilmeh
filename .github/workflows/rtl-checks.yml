name: RTL checks

# Heavy jobs: run only when RTL grader paths change (free Actions minutes).
# rtl-checks: the check library's browser tests, inside the pinned Playwright image.
# rtl-tasks: the docker tests of every RTL task (reference, known-bad, untouched, one mutation
# per check, alternative solutions, gaming attempts), on the runner's own Docker.
on:
  pull_request:
    paths:
      - "src/kilmeh/graders/**"
      - "tasks/c-rtl-ui/**"
      - "tests/test_rtl_*"
      - "tests/rtl_*/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/rtl-checks.yml"
  push:
    branches: [main]
    paths:
      - "src/kilmeh/graders/**"
      - "tasks/c-rtl-ui/**"
      - "tests/test_rtl_*"
      - "tests/rtl_*/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/rtl-checks.yml"

permissions:
  contents: read

concurrency:
  group: rtl-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rtl-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright/python:v1.64.1-noble@sha256:330d401ae23c905896a0c26c66c36fc971b621519e7b11b435a8328d7bf6e031
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked --group browser
      - run: uv run pytest -m browser

  rtl-tasks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest -m docker tests/test_rtl_tasks.py
